app = "leash-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  LEASH_ALLOWED_ORIGINS = "https://leash-spend.vercel.app,https://leash-eiy.pages.dev"
  LEASH_FEATURED_TEAM = "0xa11662194e2daB688FabCf5DF9B9D877E37BD91d"
  LEASH_PUBLIC_URL = "https://leash-api.fly.dev"
  LEASH_TRUST_PROXY = "1"

[mounts]
  source = "leash_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
