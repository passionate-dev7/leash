<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LEASH operator console</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0b0c'/%3E%3Cpath d='M3 8h4M9 8h4M8 3v10' stroke='%23ffb02e' stroke-width='1.5'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">LEASH</span>
        <span class="brand-sub">spend control plane · Tempo</span>
      </div>
      <nav class="tabs" id="tabs">
        <button class="tab is-active" data-view="fleet">Fleet</button>
        <button class="tab" data-view="new">New policy</button>
        <button class="tab" data-view="collisions">Recipient collisions</button>
        <button class="tab" data-view="sources">Data sources</button>
        <a class="tab tab-link" href="http://127.0.0.1:4175/" target="_blank" rel="noreferrer"
          >Live demo ↗</a
        >
      </nav>
      <div class="topbar-right" id="chainStatus">
        <span class="muted">connecting…</span>
      </div>
    </header>

    <main id="main">
      <section class="view" id="view-fleet">
        <aside class="rail">
          <div class="rail-head">
            <h2>Agent keys</h2>
            <button class="ghost" id="reloadFleet" title="Re-read the chain and the indexer">
              reload
            </button>
          </div>
          <div id="keyList" class="key-list"><p class="muted pad">loading…</p></div>
          <footer class="rail-foot" id="railFoot"></footer>
        </aside>
        <div class="detail" id="keyDetail">
          <p class="muted pad">Select an agent key.</p>
        </div>
      </section>

      <section class="view hidden" id="view-new">
        <div class="builder" id="builder"><p class="muted pad">loading catalog…</p></div>
      </section>

      <section class="view hidden" id="view-collisions">
        <div class="wide" id="collisions"><p class="muted pad">loading…</p></div>
      </section>

      <section class="view hidden" id="view-sources">
        <div class="wide" id="sources"><p class="muted pad">probing…</p></div>
      </section>
    </main>

    <div class="toast-stack" id="toasts"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
