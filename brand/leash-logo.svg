<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect width="1024" height="1024" fill="#150f23"/>
  <g transform="translate(99.71 -67.86) scale(1.0571)">
    <!-- the owner's hand loop -->
    <rect x="58" y="320" width="180" height="160" rx="80" fill="none" stroke="#c2ef4e" stroke-width="38"/>
    <!-- the lead, pulled taut, ending in a link -->
    <path d="M238 400 H330" fill="none" stroke="#c2ef4e" stroke-width="38" stroke-linecap="round"/>
    <circle cx="368" cy="400" r="38" fill="none" stroke="#c2ef4e" stroke-width="28"/>
    <!-- the agent's coin, held back -->
    <circle cx="520" cy="400" r="116" fill="#f4f1fa" stroke="#f4f1fa" stroke-width="2"/>
    <!-- the listed price: a ceiling the coin does not reach -->
    <path d="M720 170 V630" fill="none" stroke="#ff8fb8" stroke-width="42" stroke-linecap="round"/>
    <path d="M720 290 H676 M720 400 H676 M720 510 H676" fill="none" stroke="#ff8fb8" stroke-width="24" stroke-linecap="round"/>
  </g>
  <text x="512" y="880" text-anchor="middle" font-family="'Rubik', sans-serif" font-weight="700" font-size="200" letter-spacing="6" fill="#f4f1fa">LEASH</text>
</svg>
